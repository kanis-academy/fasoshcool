
name: Compiler FasoShcool APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'style.css'
      - 'app.js'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le site
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Preparer le site
        run: |
          mkdir -p www
          cp index.html www/
          cp style.css www/
          cp app.js www/
          if [ -f README.md ]; then cp README.md www/; fi
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Creer le projet Android
        run: |
          npx cap init FasoShcool bf.fasoshcool --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Compiler APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publier le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: FasoShcool-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
